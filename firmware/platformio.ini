; Cat Robot 首ファームウェア（XIAO ESP32C3）。設計書 docs/superpowers/specs/2026-10-23-xiao-firmware-ble-design.md §4.1
[platformio]
default_envs = xiao

[env:xiao]
platform = espressif32@8.0.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
  madhephaestus/ESP32Servo@3.2.1
build_flags = -Wall -Wextra
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror -DCATNECK_NATIVE
