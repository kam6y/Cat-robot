[project]
name = "hermes-probe-relay"
version = "0.1.0"
description = "Cat Robot Hermes connection probe (step 1): LAN TLS relay + mockbridge MCP server. Development/validation only."
requires-python = ">=3.12"
dependencies = [
    "mcp==1.30.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "starlette==1.10.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]
